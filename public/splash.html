<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F14">
<title>War Room</title>
<style>
  html,body{margin:0;height:100%;background:#0D0F14;color:#EEF0F7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(ellipse at 50% 35%,rgba(246,200,97,.16),transparent 60%),#0D0F14}
  img{width:96px;height:96px;border-radius:22%;box-shadow:0 0 28px rgba(246,200,97,.25);animation:pop .5s ease-out both}
  h1{margin:0;font-size:30px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
    background:linear-gradient(90deg,#F6C861,#E0A93B 55%,#F05A72);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:2px;background:#F6C861;animation:slide 1.1s ease-in-out infinite}
  p{margin:0;font-size:12px;color:#6E7591;min-height:16px}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<img src="/icons/icon-192.png" alt="" width="96" height="96">
<h1>War Room</h1>
<div class="bar"><i></i></div>
<p id="note">Waking up the server…</p>
<script>
// Shown by the service worker when the server is slow to answer (a sleeping
// host can take many seconds). It keeps asking for the real page and swaps to
// it as soon as it's ready.
(function () {
  var target = new URLSearchParams(location.search).get("to") || "/";
  if (target.charAt(0) !== "/" || target.slice(0, 2) === "//") target = "/";
  var started = Date.now();
  var note = document.getElementById("note");
  function go() { location.replace(target); }
  function attempt() {
    fetch(target, { headers: { "x-splash-probe": "1" }, credentials: "same-origin", redirect: "manual", cache: "no-store" })
      .then(function (res) {
        // 0 = an opaque redirect (e.g. to the sign-in page); that's still the server answering.
        if (res.type === "opaqueredirect" || (res.status > 0 && res.status < 500)) return go();
        retry();
      })
      .catch(retry);
  }
  function retry() {
    if (Date.now() - started > 15000) note.textContent = "Still starting up, hang tight…";
    setTimeout(attempt, 1500);
  }
  attempt();
})();
</script>
</body>
</html>
